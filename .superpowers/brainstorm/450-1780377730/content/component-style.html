<h2>组件风格 &amp; 视觉语言</h2>
<p class="subtitle">基于 Neon Pop 配色（白底 + 霓虹色块），选择组件的圆角/阴影/字体风格</p>

<div class="cards">

        <div style="display:flex;gap:8px;margin-bottom:12px;">

          <div style="width:44px;height:44px;background:#FFD23F;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;">+</div>
        </div>
        <div style="background:white;border-radius:24px;padding:16px;border:2px solid #eee;">
          <div style="font-size:16px;font-weight:700;font-family:sans-serif;margin-bottom:4px;color:#333;">杠铃卧推</div>
          <div style="font-size:12px;color:#999;font-family:sans-serif;margin-bottom:8px;">胸部</div>
          <div style="display:flex;gap:6px;">
            <div style="padding:4px 12px;background:#06D6A0;color:white;border-radius:20px;font-size:11px;font-weight:600;font-family:sans-serif;">65kg × 8</div>
            <div style="padding:4px 12px;background:#EF476F;color:white;border-radius:20px;font-size:11px;font-weight:600;font-family:sans-serif;">PR!</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>圆润玩趣 Playful Rounded</h3>
      <p>大圆角（24-28px）、胶囊按钮、全圆形 FAB。字体加粗、字母紧凑。像 Duolingo/Strava 那样的游戏化年轻感。</p>
    </div>
  </div>

  <div class="card" data-choice="clean" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="padding:20px;background:#f8f9fa;border-radius:16px;">
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <div style="flex:1;padding:12px;background:#FF6B35;color:white;border-radius:10px;text-align:center;font-weight:600;font-size:14px;font-family:sans-serif;">开始训练</div>
          <div style="width:44px;height:44px;background:#FFD23F;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;">+</div>
        </div>
        <div style="background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

            <div style="padding:4px 12px;background:#06D6A0;color:white;border-radius:6px;font-size:11px;font-weight:600;font-family:sans-serif;">65kg × 8</div>
            <div style="padding:4px 12px;background:#EF476F;color:white;border-radius:6px;font-size:11px;font-weight:600;font-family:sans-serif;">PR!</div>
